<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TamCode Admin Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.3.0/css/all.min.css" />
  <style>
    :root {
      --primary: #2196f3;
      --primary-dark: #1787e0;
      --success: #4caf50;
      --warning: #ff9800;
      --danger: #f44336;
      --dark: #1a1a2e;
      --darker: #16213e;
      --card: #0f3460;
      --text: #e0e0e0;
      --text-muted: #9e9e9e;
      --border: rgba(255,255,255,0.08);
      --radius: 12px;
      --shadow: 0 8px 32px rgba(0,0,0,0.3);
      --transition: 0.3s ease;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Cairo', sans-serif;
      background: var(--dark);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── Login Screen ────────────────────────────────── */
    #loginScreen {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: linear-gradient(135deg, var(--dark) 0%, var(--darker) 100%);
    }

    .login-card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 48px 40px;
      width: 100%;
      max-width: 420px;
      box-shadow: var(--shadow);
      text-align: center;
    }

    .login-card .logo {
      font-size: 2rem;
      font-weight: 800;
      color: var(--primary);
      margin-bottom: 8px;
    }

    .login-card p.subtitle {
      color: var(--text-muted);
      margin-bottom: 32px;
      font-size: 0.9rem;
    }

    .form-group {
      margin-bottom: 20px;
      text-align: left;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: var(--text-muted);
      font-size: 0.85rem;
    }

    .form-group input {
      width: 100%;
      padding: 12px 16px;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 1rem;
      font-family: 'Cairo', sans-serif;
      transition: var(--transition);
    }

    .form-group input:focus {
      outline: none;
      border-color: var(--primary);
      background: rgba(33,150,243,0.08);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-family: 'Cairo', sans-serif;
      font-size: 1rem;
      font-weight: 600;
      transition: var(--transition);
    }

    .btn-primary { background: var(--primary); color: #fff; width: 100%; justify-content: center; }
    .btn-primary:hover { background: var(--primary-dark); transform: translateY(-2px); }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-danger:hover { background: #d32f2f; }
    .btn-success { background: var(--success); color: #fff; }
    .btn-sm { padding: 6px 14px; font-size: 0.82rem; }

    #loginError {
      background: rgba(244,67,54,0.15);
      border: 1px solid rgba(244,67,54,0.3);
      color: #ef5350;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 16px;
      display: none;
      font-size: 0.9rem;
    }

    /* ── Dashboard Layout ───────────────────────────── */
    #dashboard { display: none; }

    .sidebar {
      position: fixed;
      left: 0; top: 0; bottom: 0;
      width: 260px;
      background: var(--darker);
      padding: 24px 0;
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--border);
      z-index: 100;
    }

    .sidebar-logo {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--primary);
      padding: 0 24px 24px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 16px;
    }

    .sidebar-logo span {
      font-size: 0.75rem;
      color: var(--text-muted);
      display: block;
      font-weight: 400;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 24px;
      cursor: pointer;
      color: var(--text-muted);
      transition: var(--transition);
      border-left: 3px solid transparent;
      font-weight: 500;
    }

    .nav-item:hover, .nav-item.active {
      color: var(--primary);
      background: rgba(33,150,243,0.08);
      border-left-color: var(--primary);
    }

    .nav-item i { width: 20px; text-align: center; }

    .sidebar-footer {
      margin-top: auto;
      padding: 16px 24px;
      border-top: 1px solid var(--border);
    }

    .main-content {
      margin-left: 260px;
      padding: 32px;
      min-height: 100vh;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 32px;
    }

    .top-bar h1 { font-size: 1.6rem; font-weight: 700; }
    .top-bar .welcome { color: var(--text-muted); font-size: 0.9rem; }

    /* ── Stats Cards ────────────────────────────────── */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 32px;
    }

    .stat-card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      transition: var(--transition);
    }

    .stat-card:hover { transform: translateY(-4px); }

    .stat-icon {
      width: 52px; height: 52px;
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.4rem;
    }

    .stat-icon.blue { background: rgba(33,150,243,0.2); color: var(--primary); }
    .stat-icon.green { background: rgba(76,175,80,0.2); color: var(--success); }
    .stat-icon.orange { background: rgba(255,152,0,0.2); color: var(--warning); }
    .stat-icon.red { background: rgba(244,67,54,0.2); color: var(--danger); }

    .stat-info h3 { font-size: 1.8rem; font-weight: 800; }
    .stat-info p { color: var(--text-muted); font-size: 0.85rem; }

    /* ── Sections ───────────────────────────────────── */
    .section { display: none; }
    .section.active { display: block; }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }

    .section-header h2 { font-size: 1.3rem; font-weight: 700; }

    /* ── Table ──────────────────────────────────────── */
    .table-wrapper {
      background: var(--card);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    thead th {
      background: rgba(33,150,243,0.1);
      padding: 14px 16px;
      text-align: left;
      font-size: 0.82rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--primary);
      border-bottom: 1px solid var(--border);
    }

    tbody tr {
      border-bottom: 1px solid var(--border);
      transition: var(--transition);
    }

    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: rgba(255,255,255,0.03); }

    tbody td {
      padding: 14px 16px;
      font-size: 0.9rem;
      vertical-align: middle;
    }

    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .badge-new { background: rgba(33,150,243,0.2); color: var(--primary); }
    .badge-read { background: rgba(76,175,80,0.2); color: var(--success); }
    .badge-replied { background: rgba(255,152,0,0.2); color: var(--warning); }
    .badge-discount { background: rgba(244,67,54,0.2); color: var(--danger); }
    .badge-contact { background: rgba(33,150,243,0.2); color: var(--primary); }

    .actions { display: flex; gap: 8px; }

    /* ── Loading Spinner ────────────────────────────── */
    .loading {
      text-align: center;
      padding: 48px;
      color: var(--text-muted);
    }

    .spinner {
      display: inline-block;
      width: 32px; height: 32px;
      border: 3px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 12px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Empty State ─────────────────────────────────── */
    .empty-state {
      text-align: center;
      padding: 64px 32px;
      color: var(--text-muted);
    }

    .empty-state i { font-size: 3rem; margin-bottom: 16px; opacity: 0.4; }
    .empty-state p { font-size: 1rem; }

    /* ── Toast ──────────────────────────────────────── */
    #toast {
      position: fixed;
      bottom: 32px; right: 32px;
      padding: 14px 24px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.9rem;
      z-index: 9999;
      transform: translateY(100px);
      opacity: 0;
      transition: var(--transition);
      display: flex; align-items: center; gap: 10px;
    }

    #toast.show { transform: translateY(0); opacity: 1; }
    #toast.success { background: var(--success); color: #fff; }
    #toast.error { background: var(--danger); color: #fff; }
    #toast.info { background: var(--primary); color: #fff; }

    /* ── Leaderboard Rank ───────────────────────────── */
    .rank-1 { color: gold; font-weight: 800; }
    .rank-2 { color: silver; font-weight: 700; }
    .rank-3 { color: #cd7f32; font-weight: 700; }

    /* ── Responsive ─────────────────────────────────── */
    @media (max-width: 768px) {
      .sidebar { width: 220px; }
      .main-content { margin-left: 220px; padding: 16px; }
      .stats-grid { grid-template-columns: 1fr 1fr; }
    }

    @media (max-width: 576px) {
      .sidebar { display: none; }
      .main-content { margin-left: 0; }
    }

    /* ── Message Preview ────────────────────────────── */
    .msg-preview {
      max-width: 200px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text-muted);
      font-size: 0.85rem;
    }

    /* ── Filter Bar ─────────────────────────────────── */
    .filter-bar {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .filter-bar select, .filter-bar input {
      padding: 8px 14px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: 'Cairo', sans-serif;
      font-size: 0.9rem;
    }

    .filter-bar select:focus, .filter-bar input:focus {
      outline: none;
      border-color: var(--primary);
    }

    /* ── Percentage Bar ─────────────────────────────── */
    .pct-bar {
      width: 100px;
      height: 6px;
      background: rgba(255,255,255,0.1);
      border-radius: 3px;
      overflow: hidden;
      display: inline-block;
      vertical-align: middle;
      margin-right: 8px;
    }

    .pct-bar-fill {
      height: 100%;
      border-radius: 3px;
      background: var(--primary);
    }

    .pct-bar-fill.high { background: var(--success); }
    .pct-bar-fill.mid { background: var(--warning); }
    .pct-bar-fill.low { background: var(--danger); }
  </style>
</head>
<body>

<!-- ═══════════════════════ LOGIN SCREEN ═══════════════════════ -->
<div id="loginScreen">
  <div class="login-card">
    <div class="logo"><i class="fas fa-code"></i> TamCode</div>
    <p class="subtitle">Admin Dashboard — Sign in to continue</p>
    <div id="loginError"></div>
    <div class="form-group">
      <label>Email Address</label>
      <input type="email" id="loginEmail" placeholder="admin@tamcode.com" />
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="loginPassword" placeholder="••••••••" />
    </div>
    <button class="btn btn-primary" onclick="handleLogin()">
      <i class="fas fa-sign-in-alt"></i> Sign In
    </button>
  </div>
</div>

<!-- ═══════════════════════ DASHBOARD ═══════════════════════ -->
<div id="dashboard">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-logo">
      <i class="fas fa-code"></i> TamCode
      <span>Admin Panel</span>
    </div>

    <nav>
      <div class="nav-item active" onclick="showSection('overview')">
        <i class="fas fa-chart-pie"></i> Overview
      </div>
      <div class="nav-item" onclick="showSection('contacts')">
        <i class="fas fa-envelope"></i> Contact Requests
        <span id="newContactBadge" style="margin-left:auto;background:var(--danger);color:#fff;border-radius:20px;padding:1px 8px;font-size:0.75rem;display:none"></span>
      </div>
      <div class="nav-item" onclick="showSection('subscribers')">
        <i class="fas fa-users"></i> Subscribers
      </div>
      <div class="nav-item" onclick="showSection('leaderboard')">
        <i class="fas fa-trophy"></i> Quiz Leaderboard
      </div>
      <div class="nav-item" onclick="showSection('projects')">
        <i class="fas fa-briefcase"></i> Projects
      </div>
    </nav>

    <div class="sidebar-footer">
      <button class="btn btn-danger btn-sm" onclick="handleLogout()" style="width:100%;justify-content:center;">
        <i class="fas fa-sign-out-alt"></i> Sign Out
      </button>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="main-content">
    <div class="top-bar">
      <div>
        <h1 id="sectionTitle">Overview</h1>
        <div class="welcome" id="welcomeMsg">Welcome back, Admin</div>
      </div>
      <div style="color:var(--text-muted);font-size:0.85rem;" id="currentTime"></div>
    </div>

    <!-- Overview Section -->
    <div class="section active" id="overviewSection">
      <div class="stats-grid" id="statsGrid">
        <div class="loading"><div class="spinner"></div></div>
      </div>
    </div>

    <!-- Contacts Section -->
    <div class="section" id="contactsSection">
      <div class="section-header">
        <h2><i class="fas fa-envelope" style="color:var(--primary)"></i> Contact Requests</h2>
        <button class="btn btn-primary btn-sm" onclick="loadContacts()">
          <i class="fas fa-sync-alt"></i> Refresh
        </button>
      </div>
      <div class="filter-bar">
        <select id="contactStatusFilter" onchange="loadContacts()">
          <option value="">All Status</option>
          <option value="new">New</option>
          <option value="read">Read</option>
          <option value="replied">Replied</option>
        </select>
        <select id="contactTypeFilter" onchange="loadContacts()">
          <option value="">All Types</option>
          <option value="contact">Contact</option>
          <option value="discount">Discount</option>
        </select>
      </div>
      <div id="contactsTable"></div>
    </div>

    <!-- Subscribers Section -->
    <div class="section" id="subscribersSection">
      <div class="section-header">
        <h2><i class="fas fa-users" style="color:var(--success)"></i> Newsletter Subscribers</h2>
        <button class="btn btn-primary btn-sm" onclick="loadSubscribers()">
          <i class="fas fa-sync-alt"></i> Refresh
        </button>
      </div>
      <div id="subscribersTable"></div>
    </div>

    <!-- Leaderboard Section -->
    <div class="section" id="leaderboardSection">
      <div class="section-header">
        <h2><i class="fas fa-trophy" style="color:var(--warning)"></i> Quiz Leaderboard</h2>
        <button class="btn btn-primary btn-sm" onclick="loadLeaderboard()">
          <i class="fas fa-sync-alt"></i> Refresh
        </button>
      </div>
      <div id="leaderboardTable"></div>
    </div>

    <!-- Projects Section -->
    <div class="section" id="projectsSection">
      <div class="section-header">
        <h2><i class="fas fa-briefcase" style="color:var(--primary)"></i> Projects</h2>
        <button class="btn btn-primary btn-sm" onclick="loadProjects()">
          <i class="fas fa-sync-alt"></i> Refresh
        </button>
      </div>
      <div id="projectsTable"></div>
    </div>

  </main>
</div>

<!-- Toast -->
<div id="toast"></div>

<script>
  const API = '/api';
  let token = localStorage.getItem('tc_admin_token');
  let adminName = localStorage.getItem('tc_admin_name') || 'Admin';

  // ── Init ──────────────────────────────────────────────────────────────────
  window.onload = () => {
    updateClock();
    setInterval(updateClock, 1000);
    if (token) initDashboard();
  };

  function updateClock() {
    const now = new Date();
    document.getElementById('currentTime').textContent = now.toLocaleString('en-US', {
      weekday: 'short', year: 'numeric', month: 'short',
      day: 'numeric', hour: '2-digit', minute: '2-digit'
    });
  }

  // ── Login ─────────────────────────────────────────────────────────────────
  async function handleLogin() {
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    const errEl = document.getElementById('loginError');

    if (!email || !password) {
      errEl.textContent = 'Please enter both email and password.';
      errEl.style.display = 'block';
      return;
    }

    errEl.style.display = 'none';

    try {
      const res = await fetch(`${API}/auth/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password }),
      });
      const data = await res.json();

      if (data.success) {
        token = data.token;
        adminName = data.admin.name;
        localStorage.setItem('tc_admin_token', token);
        localStorage.setItem('tc_admin_name', adminName);
        initDashboard();
      } else {
        errEl.textContent = data.message || 'Invalid credentials.';
        errEl.style.display = 'block';
      }
    } catch (err) {
      errEl.textContent = 'Cannot connect to server. Make sure the server is running.';
      errEl.style.display = 'block';
    }
  }

  // Handle Enter key
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && document.getElementById('loginScreen').style.display !== 'none') {
      handleLogin();
    }
  });

  function handleLogout() {
    localStorage.removeItem('tc_admin_token');
    localStorage.removeItem('tc_admin_name');
    token = null;
    document.getElementById('dashboard').style.display = 'none';
    document.getElementById('loginScreen').style.display = 'flex';
    showToast('Logged out successfully', 'info');
  }

  function initDashboard() {
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    document.getElementById('welcomeMsg').textContent = `Welcome back, ${adminName}`;
    loadOverview();
  }

  // ── Sections ──────────────────────────────────────────────────────────────
  const sectionTitles = {
    overview: 'Overview',
    contacts: 'Contact Requests',
    subscribers: 'Newsletter Subscribers',
    leaderboard: 'Quiz Leaderboard',
    projects: 'Projects',
  };

  const sectionLoaders = {
    overview: loadOverview,
    contacts: loadContacts,
    subscribers: loadSubscribers,
    leaderboard: loadLeaderboard,
    projects: loadProjects,
  };

  function showSection(name) {
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    document.getElementById(`${name}Section`).classList.add('active');
    document.querySelectorAll('.nav-item').forEach(n => {
      if (n.textContent.toLowerCase().includes(sectionTitles[name].split(' ')[0].toLowerCase())) {
        n.classList.add('active');
      }
    });
    document.getElementById('sectionTitle').textContent = sectionTitles[name];
    sectionLoaders[name]();
  }

  // ── API Helper ────────────────────────────────────────────────────────────
  async function apiFetch(url, options = {}) {
    const headers = { 'Content-Type': 'application/json' };
    if (token) headers['Authorization'] = `Bearer ${token}`;
    const res = await fetch(url, { ...options, headers: { ...headers, ...options.headers } });
    const data = await res.json();
    if (!data.success && res.status === 401) {
      handleLogout();
      return null;
    }
    return data;
  }

  // ── Overview ──────────────────────────────────────────────────────────────
  async function loadOverview() {
    document.getElementById('statsGrid').innerHTML = '<div class="loading"><div class="spinner"></div><p>Loading stats...</p></div>';

    const [contacts, subscribers, leaderboard, projects] = await Promise.all([
      apiFetch(`${API}/contact`),
      apiFetch(`${API}/subscribe`),
      apiFetch(`${API}/quiz/leaderboard?limit=100`),
      apiFetch(`${API}/projects`),
    ]);

    const newContacts = contacts?.data?.filter(c => c.status === 'new').length || 0;

    if (newContacts > 0) {
      const badge = document.getElementById('newContactBadge');
      badge.textContent = newContacts;
      badge.style.display = 'inline';
    }

    document.getElementById('statsGrid').innerHTML = `
      <div class="stat-card">
        <div class="stat-icon blue"><i class="fas fa-envelope"></i></div>
        <div class="stat-info">
          <h3>${contacts?.total || 0}</h3>
          <p>Total Messages</p>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon red"><i class="fas fa-bell"></i></div>
        <div class="stat-info">
          <h3>${newContacts}</h3>
          <p>New Messages</p>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon green"><i class="fas fa-users"></i></div>
        <div class="stat-info">
          <h3>${subscribers?.total || 0}</h3>
          <p>Subscribers</p>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon orange"><i class="fas fa-trophy"></i></div>
        <div class="stat-info">
          <h3>${leaderboard?.total || 0}</h3>
          <p>Quiz Players</p>
        </div>
      </div>
    `;
  }

  // ── Contacts ──────────────────────────────────────────────────────────────
  async function loadContacts() {
    document.getElementById('contactsTable').innerHTML = '<div class="loading"><div class="spinner"></div><p>Loading...</p></div>';
    const status = document.getElementById('contactStatusFilter')?.value || '';
    const type = document.getElementById('contactTypeFilter')?.value || '';
    let url = `${API}/contact?limit=50`;
    if (status) url += `&status=${status}`;
    if (type) url += `&type=${type}`;

    const data = await apiFetch(url);

    if (!data || !data.data || data.data.length === 0) {
      document.getElementById('contactsTable').innerHTML = '<div class="empty-state"><i class="fas fa-inbox"></i><p>No messages found</p></div>';
      return;
    }

    document.getElementById('contactsTable').innerHTML = `
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>#</th><th>Name</th><th>Email</th><th>Phone</th>
              <th>Message</th><th>Type</th><th>Status</th><th>Date</th><th>Actions</th>
            </tr>
          </thead>
          <tbody>
            ${data.data.map((c, i) => `
              <tr id="contact-row-${c._id}">
                <td>${i + 1}</td>
                <td><strong>${c.name}</strong></td>
                <td>${c.email}</td>
                <td>${c.phone || '—'}</td>
                <td><div class="msg-preview" title="${c.message}">${c.message}</div></td>
                <td><span class="badge badge-${c.type}">${c.type}</span></td>
                <td>
                  <select onchange="updateContactStatus('${c._id}', this.value)"
                    style="background:transparent;border:1px solid var(--border);color:var(--text);padding:4px 8px;border-radius:6px;font-family:'Cairo',sans-serif;cursor:pointer;">
                    <option ${c.status==='new'?'selected':''}>new</option>
                    <option ${c.status==='read'?'selected':''}>read</option>
                    <option ${c.status==='replied'?'selected':''}>replied</option>
                  </select>
                </td>
                <td style="font-size:0.8rem;color:var(--text-muted)">${new Date(c.createdAt).toLocaleDateString()}</td>
                <td>
                  <div class="actions">
                    <button class="btn btn-danger btn-sm" onclick="deleteContact('${c._id}')">
                      <i class="fas fa-trash"></i>
                    </button>
                  </div>
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    `;
  }

  async function updateContactStatus(id, status) {
    const data = await apiFetch(`${API}/contact/${id}`, {
      method: 'PATCH',
      body: JSON.stringify({ status }),
    });
    if (data?.success) showToast('Status updated', 'success');
  }

  async function deleteContact(id) {
    if (!confirm('Delete this message?')) return;
    const data = await apiFetch(`${API}/contact/${id}`, { method: 'DELETE' });
    if (data?.success) {
      document.getElementById(`contact-row-${id}`)?.remove();
      showToast('Message deleted', 'success');
    }
  }

  // ── Subscribers ───────────────────────────────────────────────────────────
  async function loadSubscribers() {
    document.getElementById('subscribersTable').innerHTML = '<div class="loading"><div class="spinner"></div><p>Loading...</p></div>';
    const data = await apiFetch(`${API}/subscribe?limit=100`);

    if (!data || !data.data || data.data.length === 0) {
      document.getElementById('subscribersTable').innerHTML = '<div class="empty-state"><i class="fas fa-user-slash"></i><p>No subscribers yet</p></div>';
      return;
    }

    document.getElementById('subscribersTable').innerHTML = `
      <div class="table-wrapper">
        <table>
          <thead><tr><th>#</th><th>Email</th><th>Subscribed Date</th><th>Actions</th></tr></thead>
          <tbody>
            ${data.data.map((s, i) => `
              <tr id="sub-row-${s._id}">
                <td>${i + 1}</td>
                <td>${s.email}</td>
                <td style="color:var(--text-muted);font-size:0.85rem">${new Date(s.subscribedAt).toLocaleDateString()}</td>
                <td>
                  <button class="btn btn-danger btn-sm" onclick="removeSubscriber('${s._id}')">
                    <i class="fas fa-user-minus"></i> Remove
                  </button>
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    `;
  }

  async function removeSubscriber(id) {
    if (!confirm('Remove this subscriber?')) return;
    const data = await apiFetch(`${API}/subscribe/${id}`, { method: 'DELETE' });
    if (data?.success) {
      document.getElementById(`sub-row-${id}`)?.remove();
      showToast('Subscriber removed', 'success');
    }
  }

  // ── Leaderboard ───────────────────────────────────────────────────────────
  async function loadLeaderboard() {
    document.getElementById('leaderboardTable').innerHTML = '<div class="loading"><div class="spinner"></div><p>Loading...</p></div>';
    const data = await apiFetch(`${API}/quiz/leaderboard?limit=50`);

    if (!data || !data.data || data.data.length === 0) {
      document.getElementById('leaderboardTable').innerHTML = '<div class="empty-state"><i class="fas fa-trophy"></i><p>No scores yet</p></div>';
      return;
    }

    document.getElementById('leaderboardTable').innerHTML = `
      <div class="table-wrapper">
        <table>
          <thead>
            <tr><th>Rank</th><th>Player</th><th>Score</th><th>%</th><th>Time</th><th>Category</th><th>Date</th></tr>
          </thead>
          <tbody>
            ${data.data.map((s, i) => {
              const rankClass = i === 0 ? 'rank-1' : i === 1 ? 'rank-2' : i === 2 ? 'rank-3' : '';
              const rankIcon = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : `#${i+1}`;
              const pctClass = s.percentage >= 80 ? 'high' : s.percentage >= 50 ? 'mid' : 'low';
              return `
                <tr>
                  <td class="${rankClass}">${rankIcon}</td>
                  <td><strong>${s.playerName}</strong></td>
                  <td>${s.score} / ${s.totalQuestions}</td>
                  <td>
                    <span class="pct-bar"><span class="pct-bar-fill ${pctClass}" style="width:${s.percentage}%"></span></span>
                    ${s.percentage}%
                  </td>
                  <td>${s.timeTaken}s</td>
                  <td style="color:var(--text-muted)">${s.category}</td>
                  <td style="font-size:0.8rem;color:var(--text-muted)">${new Date(s.playedAt).toLocaleDateString()}</td>
                </tr>
              `;
            }).join('')}
          </tbody>
        </table>
      </div>
    `;
  }

  // ── Projects ──────────────────────────────────────────────────────────────
  async function loadProjects() {
    document.getElementById('projectsTable').innerHTML = '<div class="loading"><div class="spinner"></div><p>Loading...</p></div>';
    const data = await apiFetch(`${API}/projects`);

    if (!data || !data.data || data.data.length === 0) {
      document.getElementById('projectsTable').innerHTML = '<div class="empty-state"><i class="fas fa-folder-open"></i><p>No projects found</p></div>';
      return;
    }

    document.getElementById('projectsTable').innerHTML = `
      <div class="table-wrapper">
        <table>
          <thead><tr><th>#</th><th>Title</th><th>Description</th><th>Tags</th><th>Order</th><th>Status</th><th>Actions</th></tr></thead>
          <tbody>
            ${data.data.map((p, i) => `
              <tr id="proj-row-${p._id}">
                <td>${i + 1}</td>
                <td><strong>${p.title}</strong></td>
                <td><div class="msg-preview">${p.description}</div></td>
                <td style="font-size:0.8rem;color:var(--text-muted)">${(p.tags || []).join(', ')}</td>
                <td>${p.order}</td>
                <td><span class="badge ${p.isPublished ? 'badge-read' : 'badge-replied'}">${p.isPublished ? 'Published' : 'Hidden'}</span></td>
                <td>
                  <div class="actions">
                    <button class="btn btn-danger btn-sm" onclick="deleteProject('${p._id}')">
                      <i class="fas fa-trash"></i>
                    </button>
                  </div>
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    `;
  }

  async function deleteProject(id) {
    if (!confirm('Delete this project?')) return;
    const data = await apiFetch(`${API}/projects/${id}`, { method: 'DELETE' });
    if (data?.success) {
      document.getElementById(`proj-row-${id}`)?.remove();
      showToast('Project deleted', 'success');
    }
  }

  // ── Toast ─────────────────────────────────────────────────────────────────
  function showToast(msg, type = 'info') {
    const t = document.getElementById('toast');
    const icons = { success: 'fa-check-circle', error: 'fa-times-circle', info: 'fa-info-circle' };
    t.className = `show ${type}`;
    t.innerHTML = `<i class="fas ${icons[type]}"></i> ${msg}`;
    setTimeout(() => { t.className = ''; }, 3000);
  }
</script>
</body>
</html>
